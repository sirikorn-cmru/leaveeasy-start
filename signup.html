<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/signup.js" type="module"></script>
</head>
<body>
  <!-- หน้านี้ไม่มีแถบเมนูและไม่มียามเฝ้าหน้า — คนที่ยังไม่ล็อกอินต้องเข้าถึงได้ -->
  <div class="container">
    <h1>🔧 LeaveEasy</h1>
    <p class="subtitle">สมัครสมาชิกเพื่อเริ่มใช้งาน</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มสมัคร">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" autocomplete="name" placeholder="ชื่อที่จะแสดงบนใบลา">

        <label for="email">อีเมล</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com">

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร">

        <p class="hint">สมัครแล้วจะได้บทบาท <strong>employee</strong> เสมอ · ถ้าต้องการบทบาทอื่นให้แก้ที่ Firebase Console</p>

        <div class="btn-row">
          <button type="submit" id="ปุ่มสมัคร">สมัครสมาชิก</button>
          <a class="btn btn-ghost" href="login.html">มีบัญชีแล้ว · เข้าสู่ระบบ</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
