<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดใบลา · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/leave-request-detail.js" type="module"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>รายละเอียดใบลา</h1>

    <div id="กล่องใบลา" class="card">
      <p>กำลังโหลดข้อมูล…</p>
    </div>

    <!-- ข้อเสนอจาก AI — ซ่อนไว้ก่อน เปิดเมื่อมีสรุปเก่าอยู่ หรือเครื่องนี้มีคีย์ -->
    <div id="กล่องAI" class="card hidden">
      <h2>🤖 สรุปให้หัวหน้าอ่านก่อนกดอนุมัติ</h2>
      <div id="ที่วางสรุป"></div>
      <div class="btn-row" id="แถวปุ่มAI"></div>
      <p class="hint">ข้อเสนอจาก AI — โปรดตรวจสอบก่อนยืนยัน · AI เปลี่ยนสถานะใบลาเองไม่ได้</p>
      <p class="hint">⚠️ ข้อความในใบลาจะถูกส่งออกไปนอกระบบ อย่าใส่ข้อมูลส่วนตัวจริง</p>
    </div>

    <div id="กล่องความเห็น" class="card hidden">
      <h2>ความเห็นการอนุมัติ</h2>
      <div id="รายการความเห็น"></div>

      <label for="ข้อความความเห็น">เขียนความเห็นใหม่</label>
      <textarea id="ข้อความความเห็น" placeholder="พิมพ์ความเห็นถึงผู้ขอลา"></textarea>
      <div id="เตือนความเห็น" class="alert alert-error hidden"></div>
      <div class="btn-row">
        <button type="button" id="ปุ่มส่งความเห็น">ส่งความเห็น</button>
      </div>
    </div>

    <div class="btn-row">
      <a class="btn btn-ghost" href="leave-requests.html">← กลับไปหน้ารายการ</a>
    </div>
  </div>
</body>
</html>
